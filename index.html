<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Escucha SuperIlógico, el nuevo EP de Opus Yeah, en tu plataforma favorita.">
  <meta name="theme-color" content="#141414">
  <title>SuperIlógico — Opus Yeah</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #141414;
      color: #fff7eb;
      --lime: #f3f64c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      min-height: 100svh;
      max-width: 72rem;
      margin-inline: auto;
      padding: clamp(1.25rem, 5vw, 4rem);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-content: center;
      align-items: center;
      gap: clamp(2rem, 6vw, 5rem);
    }
    .cover {
      padding: 0;
      border: 1px solid #59564a;
      border-radius: .75rem;
      overflow: hidden;
      background: #090909;
      color: var(--lime);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .art { width: 100%; height: auto; display: block; }
    .art[hidden] { display: none; }
    .cover-action { min-height: 3rem; display: grid; place-items: center; padding: .5rem; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    .eyebrow {
      margin: 0;
      color: var(--lime);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: .45rem 0 .75rem;
      font-size: clamp(2.35rem, 5.4vw, 4.75rem);
      font-weight: 900;
      letter-spacing: -.075em;
      line-height: 1;
    }
    .intro { margin: 0 0 1.5rem; color: #dedad0; line-height: 1.5; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 3rem;
      padding: .65rem 1rem;
      border: 1px solid #59564a;
      border-radius: .5rem;
      color: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: var(--lime); color: #141414; border-color: var(--lime); }
    :is(a, button):focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .lyrics-link { margin-top: 1rem; border-color: var(--lime); color: var(--lime); }
    @media (prefers-reduced-motion: no-preference) {
      .art:not([hidden]) { animation: cover-reveal 240ms ease-out; }
      main > section { animation: rise-in 400ms ease-out; }
      a, .cover { transition: background-color 160ms, color 160ms, border-color 160ms, transform 160ms; }
      .cover:hover { border-color: var(--lime); }
      :is(a, .cover):active { transform: scale(.98); }
    }
    @keyframes cover-reveal {
      from { opacity: .55; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes rise-in {
      from { opacity: .65; transform: translateY(.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 46rem) {
      main { grid-template-columns: minmax(0, 30rem); justify-content: center; gap: 1.5rem; }
      h1 { font-size: clamp(2.35rem, 9vw, 4.25rem); }
    }
  </style>
</head>
<body>
  <main>
    <button class="cover" type="button" aria-labelledby="cover-action">
      <img class="art" src="assets/portada.webp" width="1200" height="1200" alt="Portada de SuperIlógico, con una bicicleta y una silueta amarillas">
      <img class="art" src="assets/contraportada.webp" width="1200" height="1200" alt="Contraportada. Canciones: Diferentes, Recuperar el tiempo y SuperIlógico" hidden>
      <span id="cover-action" class="cover-action">Ver contraportada</span>
    </button>
    <span id="cover-status" class="sr-only" role="status">Portada visible</span>
    <section aria-labelledby="titulo">
      <p class="eyebrow">Opus Yeah · Nuevo EP</p>
      <h1 id="titulo">SuperIlógico</h1>
      <p class="intro">Escucha el lanzamiento en tu plataforma favorita.</p>
      <nav aria-label="Plataformas de escucha">
        <ul>
          <li><a href="https://open.spotify.com/intl-es/track/3tn6EkHgKj7iyxBajpZN3Q?si=2ba52672d8064e2d">Spotify <span aria-hidden="true">↗</span></a></li>
          <li><a href="https://music.apple.com/mx/song/diferentes/6828214586">Apple Music <span aria-hidden="true">↗</span></a></li>
          <li><a href="https://music.youtube.com/watch?v=Z2pxrd3NmuA&amp;si=bSTxk8yEHCijpfFo">YouTube Music <span aria-hidden="true">↗</span></a></li>
          <li><a href="https://link.deezer.com/s/34URhYfy7pOumOJvvivK2">Deezer <span aria-hidden="true">↗</span></a></li>
          <li><a href="https://www.youtube.com/watch?v=Z2pxrd3NmuA&amp;list=OLAK5uy_n27cqQYiTKPx5pRjxQNkLUZeypNlhL5jQ&amp;index=1">YouTube <span aria-hidden="true">↗</span></a></li>
        </ul>
      </nav>
      <a class="lyrics-link" href="letras.html">Ver letras del EP <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <script>
    const cover = document.querySelector('.cover');
    const [front, back] = cover.querySelectorAll('img');
    const action = document.getElementById('cover-action');
    const status = document.getElementById('cover-status');

    cover.addEventListener('click', () => {
      const showBack = back.hidden;
      front.hidden = showBack;
      back.hidden = !showBack;
      action.textContent = showBack ? 'Ver portada' : 'Ver contraportada';
      status.textContent = showBack
        ? 'Contraportada visible. Canciones: Diferentes, Recuperar el tiempo y SuperIlógico.'
        : 'Portada visible';
    });
  </script>
</body>
</html>
